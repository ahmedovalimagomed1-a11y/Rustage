services:
  bds:
    build:
      context: ./server/levilamina
      dockerfile: Dockerfile
    container_name: rustage-bds
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HOME: /home/codespace
      XDG_CACHE_HOME: /home/codespace/.cache
    ports:
      - "19132:19132/tcp"
      - "19132:19132/udp"
      - "19134:19134/udp"
    volumes:
      - ./server/levilamina:/app
      - /home/codespace/.local/share/lip:/home/codespace/.local/share/lip

  waterdog:
    image: eclipse-temurin:17-jre
    container_name: rustage-waterdog
    restart: unless-stopped
    stdin_open: true
    network_mode: "service:bds"
    depends_on:
      - bds
    working_dir: /app
    command: ["java", "-Xms256M", "-Xmx1G", "-jar", "Waterdog.jar"]
    volumes:
      - ./server/waterdog:/app

  tailscale:
    image: tailscale/tailscale:latest
    container_name: rustage-tailscale
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: rustage
    profiles:
      - tailscale
