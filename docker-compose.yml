services:
  bds:
    image: lomot/minecraft-bedrock:1.21.50.10
    container_name: rustage-bds
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HOME: /tmp
    stdin_open: true
    tty: true
    stop_grace_period: 30s
    ports:
      - "19132:19132/tcp"
      - "19132:19132/udp"
    volumes:
      - ./server/bds-1.21.50:/mcpe/server
      - ./server/bds-data:/data

  tailscale:
    image: tailscale/tailscale:latest
    container_name: rustage-tailscale
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: rustage
    profiles:
      - tailscale
